[package]
name = "cnd-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Local preview relay for Conductive cloud computers"
publish = false

[lints]
workspace = true

[dependencies]
internal-error = { workspace = true }
async-trait = "0.1.92"
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
if-addrs = "0.15.0"
listenfd = "1.0.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt", "macros", "io-util", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
futures-util = { version = "0.3.34", features = ["sink"] }
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = "0.30.0"
unimock = "0.6.8"
