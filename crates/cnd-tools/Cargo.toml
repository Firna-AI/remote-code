[package]
name = "cnd-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Workspace CLI and MCP tools for Conductive"
publish = false

[dependencies]
async-trait = "0.1.92"
cnd-runner-interface = { workspace = true }
internal-error = { workspace = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "io-std", "time", "sync", "rt", "macros"] }
uuid = { version = "1.29.2", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
unimock = "0.6.8"
