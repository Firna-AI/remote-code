name: CI

# CI runs on pull requests, and on pushes to main and the primary branch.
on:
  push:
    branches: [main, calummoore/conductor-alternative-architecture]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The complete gate runs as parallel jobs. `npm run check` runs the same
# steps in one process.
jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm --prefix desktop ci
          npm ci --prefix runner

      - name: Run static checks
        run: npm run check:static

  tests:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    strategy:
      # Run every shard, so one run reports every failed test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Some Worker tests import runner code, so the runner packages install too.
      - name: Install dependencies
        run: |
          npm ci
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm --prefix desktop ci
          npm ci --prefix runner

      - name: Run tests
        run: npm run test -- --shard=${{ matrix.shard }}/4

  gate:
    # The required check. GitHub counts a skipped required check as passed, so
    # this job always runs and fails unless every job above succeeded.
    name: Complete gate
    if: always()
    needs: [static, tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Check every job of the gate
        env:
          STATIC: ${{ needs.static.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "Static checks: $STATIC. Tests: $TESTS."
          test "$STATIC" = success
          test "$TESTS" = success

  rust:
    name: Rust gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust format
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Build static program
        run: cargo build --release --target x86_64-unknown-linux-musl -p cnd-cli

      # The generator formats its output with the root Prettier.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # Fail when a Rust type changed without a new run of the generator.
      - name: Check the generated types
        run: |
          set -euo pipefail
          cargo run --locked -p cnd-runner-interface --example export_bindings
          git add -N src/shared/generated
          if ! git diff --exit-code -- src/shared/generated; then
            echo '::error::src/shared/generated is out of date. Run cargo run -p cnd-runner-interface --example export_bindings and commit the result.'
            exit 1
          fi
