name: Deploy

# Deploy each push to main, or a manual run from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push never cancels a running deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # An older commit deploys nothing and starts a new run on main.
  # GitHub does not keep runs in push order.
  check:
    name: Check the commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      stale: ${{ steps.commit.outputs.stale }}
      attempt: ${{ steps.commit.outputs.attempt }}
    steps:
      - name: Check the head of main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) &&
            [[ "$head" =~ ^[[:xdigit:]]{40}$ ]]; then
            if [[ "$head" != "$GITHUB_SHA" ]]; then
              echo '::notice::This run starts a new deploy of the head of main.'
              echo 'stale=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo '::warning::Could not read a valid head of main. This run deploys its own commit.'
          fi
          echo 'stale=false' >> "$GITHUB_OUTPUT"

  settings:
    name: Check the deploy settings
    needs: check
    if: >-
      needs.check.outputs.stale == 'false' &&
      needs.check.outputs.attempt == github.run_attempt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      # Check settings before a build or a change to the deployment.
      - name: Decide whether to deploy
        id: decide
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" && "$TOKEN_SET" != true ]]; then
            echo '::warning::Deployment skipped: environment production needs secret CLOUDFLARE_API_TOKEN and variable CLOUDFLARE_ACCOUNT_ID. See docs/automatic-deploys.md#github-settings.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Environment production is missing variable CLOUDFLARE_ACCOUNT_ID.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [[ "$TOKEN_SET" != true ]]; then
            echo '::error::Environment production is missing secret CLOUDFLARE_API_TOKEN.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: [check, settings]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The egress step records each complete egress deploy as a deployment.
    permissions:
      contents: read
      deployments: write
    if: >-
      needs.settings.outputs.deploy == 'true' &&
      needs.check.outputs.attempt == github.run_attempt
    environment:
      name: production
      url: https://app.conductive.build
    env:
      RUNNER_BASE_URL: https://runner.conductive.build/
      RUNNER_BUCKET: conductive-runner
      HEALTH_URL: https://app.conductive.build/api/health
      SOFTWARE_IMAGE_URL: https://api.conductive.build/v1/deploy/software-image
    outputs:
      software_image: ${{ steps.software_image.outputs.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The deploy job skips the npm cache.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix runner

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Build before any change to the live deployment.
      - name: Build app
        run: |
          set -euo pipefail
          npm run build

      - name: Package Conductive release
        id: release
        run: |
          set -euo pipefail
          version="0.0.$(git rev-list --count HEAD)"
          input="$PWD/.context/release-input"
          mkdir -p "$input"
          npx --no-install esbuild worker/lifecycle/image-runtime.ts --bundle \
            --platform=node --format=esm --outfile="$input/runtime.mjs"
          node --input-type=module -e '
            import { IMAGE_NODE_RUNTIME } from "./.context/release-input/runtime.mjs";
            process.stdout.write(JSON.stringify(IMAGE_NODE_RUNTIME));
          ' > "$input/node.json"
          node_url=$(jq -er '.url' "$input/node.json")
          node_sha256=$(jq -er '.sha256' "$input/node.json")
          sdk_helper_sha256=$(node runner/sdk-helper/scripts/package.mjs "$input")
          sdk_helper_key="releases/download/sdk-helper/sdk-helper-$sdk_helper_sha256.tar.gz"
          mkdir -p ".context/release-artifact/$(dirname "$sdk_helper_key")"
          cp "$input/sdk-helper-$sdk_helper_sha256.tar.gz" ".context/release-artifact/$sdk_helper_key"
          system_sha256=$(bash image/package-system.sh "$input")
          system_key="releases/download/system/system-$system_sha256.tar.gz"
          mkdir -p ".context/release-artifact/$(dirname "$system_key")"
          cp "$input/system-$system_sha256.tar.gz" ".context/release-artifact/$system_key"
          cargo run --locked -p cnd-release -- parts \
            --part node "$node_url" "$node_sha256" \
            --part sdk-helper "${RUNNER_BASE_URL}${sdk_helper_key}" "$sdk_helper_sha256" \
            --part system "${RUNNER_BASE_URL}${system_key}" "$system_sha256" \
            --output "$input/parts.json"
          CONDUCTIVE_RELEASE_VERSION="$version" CONDUCTIVE_PARTS_FILE="$input/parts.json" \
            cargo build --locked --release --target x86_64-unknown-linux-musl -p cnd-cli
          cargo run --locked -p cnd-release -- package --version "$version" \
            --program target/x86_64-unknown-linux-musl/release/conductive \
            --parts "$input/parts.json" --output .context/release-artifact
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload Conductive release files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          set -euo pipefail
          token_id=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" |
            jq -r '.result.id // empty') || token_id=''
          if [[ -z "$token_id" ]]; then
            token_id=$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              'https://api.cloudflare.com/client/v4/user/tokens/verify' |
              jq -r '.result.id // empty') || token_id=''
          fi
          if [[ -z "$token_id" ]]; then
            echo '::error::Could not read the Cloudflare token ID for the release upload.'
            exit 1
          fi
          echo "::add-mask::$token_id"
          secret_key=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum)
          secret_key=${secret_key%% *}
          echo "::add-mask::$secret_key"
          export AWS_ACCESS_KEY_ID="$token_id" AWS_SECRET_ACCESS_KEY="$secret_key"
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          output=.context/release-artifact
          check_size() {
            local file="$1" url="$2" headers remote_size local_size
            headers=$(curl -fsSI --retry 3 "$url")
            remote_size=$(printf '%s\n' "$headers" |
              awk 'tolower($1) == "content-length:" {gsub("\r", "", $2); size=$2} END {print size}')
            local_size=$(stat -c %s "$file")
            if [[ "$remote_size" != "$local_size" ]]; then
              echo "::error::Public release file size does not match the local file at $url."
              return 1
            fi
          }
          while IFS= read -r -d '' file; do
            key=${file#"$output/"}
            content_type=application/gzip
            if [[ "$file" == *.json ]]; then content_type=application/json; fi
            if ! aws s3api head-object --bucket "$RUNNER_BUCKET" --key "$key" \
              --endpoint-url "$endpoint" > /dev/null 2>&1; then
              aws s3 cp "$file" "s3://$RUNNER_BUCKET/$key" --endpoint-url "$endpoint" \
                --content-type "$content_type" --cache-control 'public, max-age=31536000, immutable' \
                --only-show-errors
            fi
            check_size "$file" "${RUNNER_BASE_URL}${key}"
          done < <(find "$output/releases/download" -type f -print0)

      # Use the source config so migrations do not follow the build redirect.
      - name: Apply migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      # The egress Worker deploys when its inputs differ from the last
      # complete egress deploy, or when another version is live. A GitHub
      # deployment of the environment chatgpt-egress records each complete
      # deploy, because Wrangler makes a version live before its last step.
      - name: Deploy ChatGPT egress Worker
        id: egress
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          EGRESS_CONFIG: worker/chatgpt-egress/wrangler.jsonc
          EGRESS_RECORDS: repos/${{ github.repository }}/deployments
        run: |
          set -euo pipefail
          live_version() {
            npx wrangler deployments status --config "$EGRESS_CONFIG" --json |
              node -e 'let s="";process.stdin.on("data",(d)=>(s+=d)).on("end",()=>console.log(JSON.parse(s).versions[0].version_id))'
          }
          # Each input is a plain assignment, so that set -e stops the step
          # when one of them fails. Only the digest of the base image may be
          # unknown, which then deploys again.
          base=$(awk '/^FROM /{print $2; exit}' tools/chatgpt-egress/Dockerfile)
          [[ -n "$base" ]]
          base_digest=$(docker buildx imagetools inspect "$base" --format '{{json .Manifest.Digest}}' 2>/dev/null) || base_digest='unknown'
          files=$(git ls-files -s -- worker/chatgpt-egress tools/chatgpt-egress)
          files=$(grep -vE '(\.test\.ts|README\.md)$' <<< "$files")
          inputs=$(printf '%s\n%s %s\n' "$files" "$base" "$base_digest" | sha256sum)
          tag="egress-${inputs:0:16}"
          live=$(live_version) || live=''
          recorded=$(gh api "$EGRESS_RECORDS?environment=chatgpt-egress&per_page=1" \
            --jq '.[0] | "\(.id) \(.payload.version_id) \(.payload.tag)"') || recorded=''
          if [[ -n "$recorded" && -n "$live" ]]; then
            read -r record_id record_version record_tag <<< "$recorded"
            state=$(gh api "$EGRESS_RECORDS/$record_id/statuses?per_page=1" --jq '.[0].state') || state=''
            if [[ "$state" == success && "$record_version" == "$live" && "$record_tag" == "$tag" ]]; then
              echo "The egress Worker is current: $tag, version $live."
              echo 'result=current' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if ! npx wrangler deploy --config "$EGRESS_CONFIG" --tag "$tag" --message "main at $GITHUB_SHA"; then
            echo '::warning::The ChatGPT egress Worker did not deploy completely. The next run deploys it again. See docs/automatic-deploys.md#when-a-deploy-fails.'
            echo 'result=failed' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'result=deployed' >> "$GITHUB_OUTPUT"
          live=$(live_version) || live=''
          if ! record_id=$(printf '{"ref":"%s","environment":"chatgpt-egress","auto_merge":false,"required_contexts":[],"description":"%s","payload":{"version_id":"%s","tag":"%s"}}' \
            "$GITHUB_SHA" "$tag" "$live" "$tag" | gh api "$EGRESS_RECORDS" --input - --jq '.id') ||
            ! gh api "$EGRESS_RECORDS/$record_id/statuses" -f state=success > /dev/null; then
            echo '::warning::The egress deploy record failed. The next run deploys the egress Worker again.'
          fi

      # Wrangler follows the build redirect to the built Worker.
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          deploy_token=$(openssl rand -hex 32)
          echo "::add-mask::$deploy_token"
          printf '%s' "$deploy_token" > "$RUNNER_TEMP/conductive-deploy-token"
          deploy_digest=$(sha256sum "$RUNNER_TEMP/conductive-deploy-token")
          deploy_digest=${deploy_digest%% *}
          npx wrangler deploy \
            --var "CONDUCTIVE_DEPLOY_TOKEN_SHA256:$deploy_digest" \
            --tag "${GITHUB_SHA:0:7}" --message "main at $GITHUB_SHA"

      - name: Check health
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if body=$(curl -fsS --max-time 10 "$HEALTH_URL") &&
              jq -e '.status == "ok"' <<< "$body" > /dev/null; then
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          echo "::error::Health check failed for $HEALTH_URL."
          exit 1

      - name: Publish Conductive release
        id: publish_release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          token_id=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" |
            jq -r '.result.id // empty') || token_id=''
          if [[ -z "$token_id" ]]; then
            token_id=$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              'https://api.cloudflare.com/client/v4/user/tokens/verify' |
              jq -r '.result.id // empty') || token_id=''
          fi
          if [[ -z "$token_id" ]]; then
            echo '::error::Could not read the Cloudflare token ID for the release upload.'
            exit 1
          fi
          echo "::add-mask::$token_id"
          secret_key=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum)
          secret_key=${secret_key%% *}
          echo "::add-mask::$secret_key"
          export AWS_ACCESS_KEY_ID="$token_id" AWS_SECRET_ACCESS_KEY="$secret_key"
          endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          output=.context/release-artifact
          latest_key=releases/latest/conductive/x86_64-unknown-linux-musl
          check_size() {
            local file="$1" url="$2" headers remote_size local_size
            headers=$(curl -fsSI --retry 3 "$url")
            remote_size=$(printf '%s\n' "$headers" |
              awk 'tolower($1) == "content-length:" {gsub("\r", "", $2); size=$2} END {print size}')
            local_size=$(stat -c %s "$file")
            if [[ "$remote_size" != "$local_size" ]]; then
              echo "::error::Public release file size does not match the local file at $url."
              return 1
            fi
          }
          # Read R2 directly. A cached public JSON must never decide version ordering.
          aws s3api list-objects-v2 --bucket "$RUNNER_BUCKET" --prefix "$latest_key" \
            --endpoint-url "$endpoint" > .context/release-input/objects.json
          if jq -e --arg key "$latest_key" 'any(.Contents[]?; .Key == $key)' \
            .context/release-input/objects.json > /dev/null; then
            aws s3api get-object --bucket "$RUNNER_BUCKET" --key "$latest_key" \
              --endpoint-url "$endpoint" .context/release-input/current.json > /dev/null
            newer=$(cargo run --locked -p cnd-release -- newer \
              --candidate "$output/$latest_key" --current .context/release-input/current.json)
            if [[ "$newer" != true ]]; then
              echo 'The public release is already at this version or a higher version.'
              echo 'result=kept' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          aws s3 cp "$output/$latest_key" "s3://$RUNNER_BUCKET/$latest_key" \
            --endpoint-url "$endpoint" --content-type application/json \
            --cache-control 'max-age=60' --only-show-errors
          check_size "$output/$latest_key" "${RUNNER_BASE_URL}${latest_key}?version=$RELEASE_VERSION"
          echo 'result=published' >> "$GITHUB_OUTPUT"

      - name: Build software image
        id: software_image
        run: |
          set -euo pipefail
          deploy_token=$(cat "$RUNNER_TEMP/conductive-deploy-token")
          deploy_digest=$(printf '%s' "$deploy_token" | sha256sum)
          deploy_digest=${deploy_digest%% *}
          body=$(jq -nc --arg digest "$deploy_digest" '{tokenDigest: $digest}')
          response_file="$RUNNER_TEMP/conductive-software-image-response"
          deadline=$((SECONDS + 900))
          result=timeout
          last_phase=''
          version=''
          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then break; fi
            request_time=$((remaining < 30 ? remaining : 30))
            if code=$(curl -sS --max-time "$request_time" \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' \
              --header "Authorization: Bearer $deploy_token" \
              --data "$body" "$SOFTWARE_IMAGE_URL"); then
              case "$code" in
                200)
                  if ! jq -e 'type == "object" and
                    (.state == "building" or .state == "ready" or .state == "failed") and
                    (.phase | type == "string") and (.version | type == "string") and
                    (.output | type == "string")' "$response_file" > /dev/null; then
                    echo 'Software image response is not valid.'
                    result=refused
                    break
                  fi
                  phase=$(jq -r '.phase' "$response_file")
                  version=$(jq -r '.version' "$response_file")
                  if [[ "$phase" != "$last_phase" ]]; then
                    printf 'Software image phase: %s\n' "$phase"
                    last_phase=$phase
                  fi
                  jq -rj '.output' "$response_file"
                  state=$(jq -r '.state' "$response_file")
                  if [[ "$state" == ready ]]; then
                    result=ready
                    break
                  fi
                  if [[ "$state" == failed ]]; then
                    jq -r '.error // "The software image build failed."' "$response_file"
                    jq -rj '.keptOutput // ""' "$response_file"
                    result=failed
                    break
                  fi
                  ;;
                400|401|403|404)
                  printf 'Software image request refused: HTTP %s.\n' "$code"
                  result=refused
                  break
                  ;;
                409|429|5??)
                  printf 'Software image request will retry: HTTP %s.\n' "$code"
                  ;;
                *)
                  printf 'Software image request returned unexpected HTTP %s.\n' "$code"
                  result=refused
                  break
                  ;;
              esac
            else
              echo 'Software image request will retry after a network error.'
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then break; fi
            delay=$((remaining < 10 ? remaining : 10))
            sleep "$delay"
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          {
            printf '### Software image\n\nResult: %s\n\n' "$result"
            printf 'Version: %s\n\nPhase: %s\n' "${version:-unknown}" "${last_phase:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write deploy summary
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_RESULT: ${{ steps.publish_release.outputs.result }}
          EGRESS_RESULT: ${{ steps.egress.outputs.result }}
        run: |
          set -euo pipefail
          {
            printf 'Commit: %s\n\n' "$GITHUB_SHA"
            printf 'Conductive release: %s, %s\n\n' "$RELEASE_VERSION" "$RELEASE_RESULT"
            printf 'ChatGPT egress Worker: %s\n' "$EGRESS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  software-image:
    name: Check the software image result
    needs: [check, deploy]
    if: >-
      ${{ !cancelled() && needs.deploy.result == 'success' &&
      needs.check.outputs.attempt == github.run_attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a ready software image
        env:
          SOFTWARE_IMAGE_RESULT: ${{ needs.deploy.outputs.software_image }}
        run: |
          set -euo pipefail
          if [[ "$SOFTWARE_IMAGE_RESULT" != ready ]]; then
            echo "::error::The software image step ended with ${SOFTWARE_IMAGE_RESULT:-no result}. A ready software image is required. The Worker is already live. Re-run all jobs to retry."
            exit 1
          fi

  # Older commits and partial re-runs start a new run on main.
  # A re-run keeps the outputs of jobs that passed.
  redeploy:
    name: Start a deploy of the head
    needs: [check, deploy, software-image]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' &&
      (needs.check.outputs.stale == 'true' || needs.check.outputs.attempt != github.run_attempt) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start a deploy of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -f ref=main > /dev/null; then
            echo '::error::Could not start a new deploy of the head of main.'
            exit 1
          fi
