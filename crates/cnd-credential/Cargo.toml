[package]
name = "cnd-credential"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Fresh GitHub credentials for Conductive cloud computers"
publish = false

[lints]
workspace = true

[dependencies]
internal-error = { workspace = true }
async-trait = "0.1.92"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "io-std"] }
unicode-general-category = "1.1.0"

[dev-dependencies]
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tokio-rustls = "0.26.6"
unimock = "0.6.8"
